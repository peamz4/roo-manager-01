<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📕 Card Queue</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#f8f7f4;--surface3:#f0efe9;
  --border:#e2e0d8;--border2:#ccc9be;--text:#1a1916;--text2:#6b6860;--text3:#a09e96;
  --accent:#2563eb;--accent-bg:#eff6ff;
  --white-color:#1e40af;--white-bg:#eff6ff;--white-border:#93c5fd;
  --red-color:#9a3412;--red-bg:#fff7ed;--red-border:#fdba74;
  --green:#16a34a;--green-bg:#f0fdf4;--green-border:#bbf7d0;
  --warn:#d97706;--warn-bg:#fffbeb;--warn-border:#fde68a;
  --card-color:#7c3aed;--card-bg:#f5f3ff;--card-border:#c4b5fd;
  --radius:10px;--radius-sm:7px;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 14px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans','Noto Sans Thai',sans-serif;font-size:14px;min-height:100vh;}

/* ── Header ── */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;gap:12px;height:52px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
.hlogo{font-size:16px;font-weight:600;color:var(--text);white-space:nowrap;letter-spacing:-.3px;}
.hlogo span{color:var(--white-color);}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px;}

/* ── Buttons ── */
.btn{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;font-family:'DM Sans','Noto Sans Thai',sans-serif;transition:all .15s;display:inline-flex;align-items:center;gap:5px;box-shadow:var(--shadow);white-space:nowrap;}
.btn:hover{background:var(--surface3);border-color:var(--border2);}
.btn.bprimary{background:var(--white-bg);border-color:var(--white-border);color:var(--white-color);}
.btn.bprimary:hover{background:#dbeafe;}
.btn.bgreen{background:var(--green-bg);border-color:var(--green-border);color:var(--green);}
.btn.bgreen:hover{background:#dcfce7;}
.btn.bdanger{background:#fef2f2;border-color:#fecaca;color:#dc2626;}

/* ── Layout ── */
.main-wrap{display:flex;height:calc(100vh - 52px);}
.sidebar{width:280px;min-width:280px;border-right:1px solid var(--border);background:var(--surface2);display:flex;flex-direction:column;overflow:hidden;}
.content{flex:1;overflow-y:auto;padding:16px;}

/* ── Sidebar ── */
.sidebar-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.sidebar-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
.sidebar-body{flex:1;overflow-y:auto;padding:10px;}

/* ── Config Panel ── */
.config-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
.config-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.config-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.config-row:last-child{margin-bottom:0;}
.config-label{font-size:12px;color:var(--text2);flex:1;}
.config-input{width:70px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:'DM Mono',monospace;text-align:center;background:var(--surface);}
.config-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.1);}
.config-badge{font-size:11px;padding:2px 7px;border-radius:20px;font-weight:600;}
.badge-white{background:var(--white-bg);color:var(--white-color);border:1px solid var(--white-border);}
.badge-red{background:var(--red-bg);color:var(--red-color);border:1px solid var(--red-border);}
.badge-card{background:var(--card-bg);color:var(--card-color);border:1px solid var(--card-border);}

/* ── Sheet ID ── */
.sheet-input{width:100%;padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:11px;font-family:'DM Mono',monospace;background:var(--surface);color:var(--text);}
.sheet-input:focus{outline:none;border-color:var(--accent);}

/* ── Queue List ── */
.que-item{padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .12s;border:1px solid transparent;margin-bottom:4px;}
.que-item:hover{background:var(--surface3);border-color:var(--border);}
.que-item.active{background:var(--white-bg);border-color:var(--white-border);}
.que-item.done{opacity:.5;}
.que-num{width:22px;height:22px;border-radius:6px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'DM Mono',monospace;color:var(--text2);flex-shrink:0;}
.que-item.active .que-num{background:var(--white-color);color:#fff;}
.que-name{font-size:13px;font-weight:500;flex:1;}
.que-team{font-size:11px;color:var(--text3);}
.que-done-badge{font-size:10px;padding:1px 6px;border-radius:10px;background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);}

/* ── Main Content ── */
.section-header{display:flex;align-items:center;justify-content:between;gap:10px;margin-bottom:14px;}
.section-title{font-size:16px;font-weight:600;letter-spacing:-.3px;}
.section-sub{font-size:12px;color:var(--text2);margin-top:2px;}

/* ── Summary Bar ── */
.summary-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);}
.stat-label{font-size:11px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.stat-value{font-size:22px;font-weight:600;font-family:'DM Mono',monospace;letter-spacing:-.5px;}
.stat-value.white{color:var(--white-color);}
.stat-value.red{color:var(--red-color);}
.stat-value.neutral{color:var(--text);}
.stat-note{font-size:11px;color:var(--text3);margin-top:2px;}

/* ── Progress Bar ── */
.progress-wrap{margin-bottom:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);}
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.progress-row:last-child{margin-bottom:0;}
.progress-label{font-size:12px;font-weight:600;width:40px;flex-shrink:0;}
.progress-label.white{color:var(--white-color);}
.progress-label.red{color:var(--red-color);}
.progress-bar{flex:1;height:8px;background:var(--surface3);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;border-radius:4px;transition:width .4s ease;}
.progress-fill.white{background:var(--white-color);}
.progress-fill.red{background:#f97316;}
.progress-text{font-size:11px;font-family:'DM Mono',monospace;color:var(--text2);width:60px;text-align:right;flex-shrink:0;}

/* ── Member Table ── */
.result-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);}
.result-table th{background:var(--surface3);padding:8px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);}
.result-table th.num{text-align:center;}
.result-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
.result-table tr:last-child td{border-bottom:none;}
.result-table tr:hover td{background:var(--surface2);}
.result-table td.num{text-align:center;font-family:'DM Mono',monospace;}

.name-cell{font-weight:500;}
.team-tag{font-size:10px;color:var(--text3);margin-top:1px;}

.feather-need{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;}
.feather-need.white{color:var(--white-color);}
.feather-need.red{color:var(--red-color);}
.feather-need.card{color:var(--card-color);}

.feather-actual{font-family:'DM Mono',monospace;font-size:14px;font-weight:700;}
.feather-actual.match{color:var(--green);}
.feather-actual.partial{color:var(--warn);}
.feather-actual.zero{color:var(--text3);}

.page-range{font-size:12px;line-height:1.6;color:var(--text2);}
.page-line{display:flex;align-items:baseline;gap:5px;}
.page-type{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;flex-shrink:0;}
.page-type.white{background:var(--white-bg);color:var(--white-color);}
.page-type.red{background:var(--red-bg);color:var(--red-color);}
.page-type.card{background:var(--card-bg);color:var(--card-color);}
.page-text{font-family:'DM Mono',monospace;font-size:11px;}
.warn-text{color:var(--warn);font-size:11px;font-weight:500;}

.total-row td{background:var(--surface2);font-weight:600;border-top:2px solid var(--border2);}

/* ── Empty / Loading States ── */
.empty-state{text-align:center;padding:60px 20px;color:var(--text3);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-title{font-size:16px;font-weight:600;color:var(--text2);margin-bottom:6px;}
.empty-sub{font-size:13px;}

.loading-state{text-align:center;padding:40px 20px;color:var(--text2);}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Toast ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:#fff;padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;z-index:999;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;max-width:300px;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{background:#15803d;}
.toast.error{background:#dc2626;}

/* ── Status badge ── */
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;}
.dot-green{background:var(--green);}
.dot-yellow{background:var(--warn);}
.dot-gray{background:var(--text3);}

/* ── Section divider ── */
.divider{height:1px;background:var(--border);margin:16px 0;}

/* ── Responsive ── */
@media(max-width:680px){
  .sidebar{display:none;}
  .summary-bar{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<header>
  <div class="hlogo">📕 <span>Card</span> Queue</div>
  <div style="font-size:12px;color:var(--text3);padding:3px 10px;background:var(--surface3);border-radius:20px;border:1px solid var(--border);" id="guildNameBadge">LostAokAok</div>
  <div class="header-right">
    <button class="btn bprimary" onclick="loadData()">⟳ โหลดข้อมูล</button>
    <a href="feather.html" class="btn" style="text-decoration:none;">🪶 Feather</a>
    <a href="index.html" class="btn" style="text-decoration:none;">← Party Manager</a>
  </div>
</header>

<div class="main-wrap">
  <!-- ── Sidebar ── -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">ตั้งค่า + คิว</span>
    </div>
    <div class="sidebar-body">

      <!-- Sheet Config -->
      <div class="config-panel">
        <div class="config-title">Google Sheet ID</div>
        <input class="sheet-input" id="sheetId" value="" placeholder="Spreadsheet ID">
      </div>

      <!-- Limit Config (Card) -->
      <div class="config-panel">
        <div class="config-title">Limit รอบนี้ (ต่อคน)</div>
        <div class="config-row">
          <span class="config-label"><span class="config-badge badge-card">การ์ด</span> limit</span>
          <input class="config-input" id="limitCard" type="number" value="10" min="0" oninput="recalc()">
        </div>
      </div>

      <!-- Total Card Config -->
      <div class="config-panel">
        <div class="config-title">การ์ดรวมรอบนี้</div>
        <div class="config-row">
          <span class="config-label"><span class="config-badge badge-card">การ์ด</span> รวม</span>
          <input class="config-input" id="totalCard" type="number" value="140" min="0" oninput="recalc()">
        </div>
      </div>
      <!-- เครื่องช่วยนับการ์ดจากหน้าจอเกม -->
      <div class="config-panel" style="background: var(--surface2); border: 1px dashed var(--border2); margin-top: 12px;">
        <div class="config-title" style="margin-bottom: 10px;">
          <span style="font-weight: 600;">🧮 เครื่องช่วยนับจากหน้าจอเกม</span>
        </div>
        <div style="font-size: 11px; margin-bottom: 8px; color: var(--text2);">
          จุดเริ่ม <span class="config-badge badge-card" style="padding:2px 6px;">การ์ด</span>
          <div style="display:flex; gap:6px; margin-top:4px;">
            <input type="number" id="calcCStartP" class="config-input" style="flex:1;" placeholder="หน้า" value="1" min="1">
            <input type="number" id="calcCStartI" class="config-input" style="flex:1;" placeholder="อันที่ (1-4)" value="1" min="1" max="4">
          </div>
        </div>
        <div style="font-size: 11px; margin-bottom: 10px; color: var(--text2);">
          จุดจบ <span class="config-badge badge-card" style="padding:2px 6px;">การ์ด</span>
          <div style="display:flex; gap:6px; margin-top:4px;">
            <input type="number" id="calcCEndP" class="config-input" style="flex:1;" placeholder="หน้า" min="1">
            <input type="number" id="calcCEndI" class="config-input" style="flex:1;" placeholder="อันที่ (1-4)" min="1" max="4">
          </div>
        </div>
        <button type="button" class="btn bprimary" style="width: 100%; justify-content: center; background: var(--card-color); color: #fff; padding: 6px; border-radius: 6px; cursor: pointer;" onclick="applyCalculatedCards()">
          ใช้ผลการคำนวณ ⚡
        </button>
      </div>
      <!-- Queue List -->
      <div class="config-panel" style="padding:0;overflow:hidden;">
        <div style="padding:8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;">
  <div class="config-title" style="margin-bottom:0;">คิวที่จะรัน</div>
  <button id="btnShowAll" onclick="toggleShowAll()"
    style="font-size:10px;padding:3px 8px;border-radius:12px;border:1px solid var(--border);background:var(--surface3);color:var(--text2);cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .15s;">
    แสดงทั้งหมด
  </button>
</div>
        <div style="padding:8px;" id="queList">
          <div style="text-align:center;padding:20px;color:var(--text3);font-size:12px;">กด "โหลดข้อมูล"</div>
        </div>
      </div>

    </div>
  </div>

  <!-- ── Content ── -->
  <div class="content" id="mainContent">
    <div class="empty-state">
      <div class="empty-icon">📕</div>
      <div class="empty-title">Card Queue</div>
      <div class="empty-sub">ตั้งค่า Sheet ID และ limit ทางซ้าย<br>แล้วกด "โหลดข้อมูล"</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
    // guard: ต้อง login ผ่าน Hub ก่อน
if (sessionStorage.getItem('roo_logged_in') !== 'true') {
    window.location.href = 'index.html';
}
// ── Config ──────────────────────────────────────────────────
const GID_CARD_LIST  = APP_CONFIG.auctionListCardGid || '578614701';

// ── State ────────────────────────────────────────────────────
let allRowsOriginal = []; 
let queData = [];
let showAllMode = false;         
let selectedQue = null;   

// ── Helpers ─────────────────────────────────────────────────
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  setTimeout(() => el.className = 'toast', 2800);
}

function csvUrl(sheetId, gid) {
  return `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`;
}

async function fetchCSV(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.text();
}

function parseCSV(text) {
  return text.split('\n').map(row => {
    const cells = [];
    let cur = '', inQ = false;
    for (let c of row) {
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { cells.push(cur.trim()); cur = ''; }
      else cur += c;
    }
    cells.push(cur.trim());
    return cells;
  });
}

function toggleShowAll() {
  showAllMode = !showAllMode;
  const btn = document.getElementById('btnShowAll');
  if (btn) {
    btn.textContent = showAllMode ? '✕ เฉพาะที่ขาด' : 'แสดงทั้งหมด';
    btn.style.background = showAllMode ? 'var(--green-bg)' : 'var(--surface3)';
    btn.style.color = showAllMode ? 'var(--green)' : 'var(--text2)';
    btn.style.borderColor = showAllMode ? 'var(--green-border)' : 'var(--border)';
  }
  rebuildQueData();
}

function rebuildQueData() {
  let qNum = 1;
  queData = [];
  for (const m of allRowsOriginal) {
    if (showAllMode || m.card > 0) {
      queData.push({ num: qNum++, name: m.name, card: m.card,
                     cCheck: false, done: m.card === 0 });
    }
  }
  renderQueList();
  if (selectedQue) {
    const found = queData.find(x => x.name === selectedQue.name);
    if (found) selectQue(found);
    else if (queData.length > 0) selectQue(queData[0]);
    else showEmptyContent();
  } else if (queData.length > 0) selectQue(queData[0]);
}
// ── Load Data ────────────────────────────────────────────────
async function loadData() {
  const sheetId = document.getElementById('sheetId').value.trim();
  if (!sheetId) { toast('กรุณาใส่ Sheet ID', 'error'); return; }

  document.getElementById('mainContent').innerHTML = `
    <div class="loading-state"><div class="spinner"></div>กำลังโหลดข้อมูลจาก AuctionListCard...</div>`;

  try {
    const alText = await fetchCSV(csvUrl(sheetId, GID_CARD_LIST));
    const alRows = parseCSV(alText);

    allRowsOriginal = [];
    queData = [];

    for (let i = 1; i < alRows.length; i++) {
      const row = alRows[i];
      const name = (row[0] || '').trim(); 
      if (!name) continue;

      const cD = parseInt(row[6]);   // col G = CardDeduct

      const cardNeed = isNaN(cD) ? 0 : Math.max(0, cD);

      const memberItem = { name: name, card: cardNeed };
      allRowsOriginal.push(memberItem);
    }

rebuildQueData();
toast(`ดึง Data สำเร็จ — สมาชิกทั้งหมด ${allRowsOriginal.length} คน (ในคิว ${queData.length} คน)`, 'success');

  } catch(e) {
    console.error(e);
    toast('โหลดไม่ได้ — ตรวจสอบสิทธิ์หรือ Sheet ID', 'error');
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <div class="empty-title">โหลดข้อมูลไม่ได้</div>
        <div class="empty-sub">ตรวจสอบว่าเปิดแชร์ลิงก์ "Anyone with link can view" แล้ว<br>และคัดลอกรหัสคีย์สเปรดชีตมาถูกต้อง</div>
      </div>`;
  }
}

// ── Render Queue Sidebar ─────────────────────────────────────
// ── Render Queue Sidebar ─────────────────────────────────────
function renderQueList() {
  const el = document.getElementById('queList');
  if (!queData.length) {
    el.innerHTML = '<div style="text-align:center;padding:16px;color:var(--text3);font-size:12px;">ไม่พบข้อมูลคิว</div>';
    return;
  }
  
  let html = queData.map(q => `
    <div class="que-item ${selectedQue&&selectedQue.num===q.num?'active':''}"
         onclick="selectQue(${JSON.stringify(q).replace(/"/g,'&quot;')})">
      <div class="que-num">${q.num}</div>
      <div style="flex:1;min-width:0;">
        <div class="que-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:6px;">${q.name}</div>
        <div>
          <div style="font-size:10px; padding:3px 0; text-align:center; border-radius:4px; font-weight:600; transition:all 0.2s;
                      background:${q.cCheck ? '#f5f3ff' : '#f5f4f0'}; 
                      color:${q.cCheck ? '#7c3aed' : '#a09e96'}; 
                      border:1px solid ${q.cCheck ? '#c4b5fd' : '#e2e0d8'};">
            ${q.cCheck ? '✅ การ์ด' : '⬜ การ์ด'}
          </div>
        </div>
      </div>
    </div>`).join('');

  html += `
    <div style="padding:10px;margin-top:15px;border-top:1px dashed var(--border);">
      <button class="btn bprimary" style="width:100%;justify-content:center;font-size:12px;gap:4px;" onclick="copyDataBackToSheet()">
        📋 ก๊อปปี้ยอดอัปเดต (เพื่อวางทับ Sheet)
      </button>
    </div>`;
    
  el.innerHTML = html;
}

function selectQue(q) {
  // ดึงค่า Checkbox ล่าสุดจาก queData ก่อนเซ็ต
  selectedQue = queData.find(x => x.num === q.num) || q;
  renderQueList();
  renderResult(selectedQue);
}

// ── ฟังก์ชันติ๊ก Checkbox (Manual Toggle) ─────────────────────
function toggleCheck(num) {
  const q = queData.find(x => x.num === num);
  if (q) {
    q.cCheck = !q.cCheck;
    renderQueList(); // อัปเดตไอคอนในแถบซ้าย
  }
}

function showEmptyContent() {
  document.getElementById('mainContent').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">✅</div>
      <div class="empty-title">ไม่มีคิวที่ต้องดึง</div>
    </div>`;
}

// ── Render Result (หน้าต่างแสดงผลหลัก) ────────────────────────
// ── Render Result (หน้าต่างแสดงผลหลัก) ────────────────────────
// ── Render Result (หน้าต่างแสดงผลหลัก) ────────────────────────
// ── Render Result (หน้าต่างแสดงผลหลัก) ────────────────────────
// ── Render Result (หน้าต่างแสดงผลหลัก ปรับ Highlight ให้วาดยาวและสีเข้มขึ้น) ────────────────────────
function renderResult(q) {
  const limitC = parseInt(document.getElementById('limitCard').value) || 0;
  const totalC = parseInt(document.getElementById('totalCard').value) || 0;

  // จำลองการรันคิวทั้งหมด เพื่อหาว่าใครได้การ์ดเท่าไหร่
  let simCCur = 0;
  const allResults = queData.map(pq => {
    const orig = allRowsOriginal.find(x => x.name === pq.name) || {card:0};
    const nC = Math.min(orig.card, limitC);
    const aC = Math.min(nC, Math.max(0, totalC - simCCur));
    simCCur += aC;
    return {
      name: pq.name, num: pq.num, origC: orig.card,
      needC: nC, actC: aC,
      remC: Math.max(0, orig.card - aC)
    };
  });

  const sumNeedC = allResults.reduce((s,x)=>s+x.needC,0);
  const sumActC  = allResults.reduce((s,x)=>s+x.actC,0);
  const sumRemC  = allResults.reduce((s,x)=>s+x.remC,0);
  const pctC = totalC > 0 ? Math.round(sumActC/totalC*100) : 0;

  document.getElementById('mainContent').innerHTML = `
    <div style="position: sticky; top: 15px; z-index: 100; background: var(--surface2); border: 2px solid var(--border2); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 24px; display: flex; gap: 32px; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,0.12);">
      <div style="font-size:15px; font-weight:700; color:var(--text2);">ทำรายการของคิว (${q.name}):</div>
      <label style="display:flex; align-items:center; gap:10px; cursor:pointer; font-size:16px; font-weight:600;">
        <input type="checkbox" style="width:22px; height:22px; accent-color:#7c3aed; cursor:pointer;" 
               ${q.cCheck ? 'checked' : ''} onchange="toggleCheck(${q.num})">
        ✅ กดรับการ์ด
      </label>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <div style="font-size:14px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;">ตารางจำลองการเกลี่ยการ์ดทั้งหมด</div>
      <button class="btn" style="background:#fff; border:1px solid #ccc; font-size:13px; padding:6px 12px; gap:6px; box-shadow:0 1px 2px rgba(0,0,0,0.05);" onclick="copyFullTable()">
        📋 ก๊อปปี้ตารางนี้ทั้งหมด (ไปแปะ Sheet)
      </button>
    </div>

    <table class="result-table">
      <thead>
        <tr>
          <th class="num" style="font-size:13px; padding:12px 8px;">#</th>
          <th style="font-size:13px; padding:12px 8px;">ชื่อ</th>
          <th class="num" style="min-width:80px; font-size:13px; padding:12px 8px;">
            📕 การ์ด<br><span style="font-weight:400;color:var(--text3);font-size:11px;">สิทธิ์จำกัด</span>
          </th>
          <th class="num" style="min-width:80px; font-size:13px; padding:12px 8px;">
            📕 การ์ด<br><span style="font-weight:400;color:var(--text3);font-size:11px;">ได้จริง</span>
          </th>
          <th class="num" style="background:#fefce8; min-width:80px; font-size:13px; padding:12px 8px;">
            📕 การ์ด<br><span style="font-weight:400;color:#854d0e;font-size:11px;">คงเหลือ</span>
          </th>
          <th style="background:#f5f3ff; border-left:1px solid var(--card-border); text-align:center; font-size:13px; padding:12px 8px;">
            📕 หน้าประมูล<br><span style="color:var(--card-color);font-size:12px;">(การ์ด)</span>
          </th>
        </tr>
      </thead>
      <tbody>
${allResults.map((m,i) => {
          const isSelected = m.num === q.num;
          const trBg = isSelected ? 'background:#ede9fe;' : '';
          const remainBg = isSelected ? '' : 'background:#fefce8;';
          const pageBg = isSelected ? '' : 'background:#f5f3ff;';
          let cP = '';
          let localCur = 0;
          for(let j=0; j<i; j++) localCur += allResults[j].actC;
          if(m.actC>0) cP = pageLabel(localCur, localCur + m.actC - 1, 4);
          return `<tr style="${trBg}">
            <td class="num" style="font-family:'DM Mono';font-size:14px;color:var(--text3); padding:12px 8px;">${m.num}</td>
            <td style="padding:12px 8px;"><div style="font-weight:${isSelected?700:500}; font-size:14px;">${m.name}</div></td>
            <td class="num" style="padding:12px 8px;"><span class="feather-need card" style="font-size:14px;">${m.needC||'—'}</span></td>
            <td class="num" style="padding:12px 8px;"><span class="feather-actual ${m.actC===m.needC&&m.needC>0?'match':m.actC>0?'partial':'zero'}" style="font-size:14px;">${m.actC||'—'}</span></td>
            <td class="num" style="${remainBg} padding:12px 8px;"><span style="color:${m.remC===0?'var(--green)':'var(--text2)'};font-weight:700;font-size:14px;">${m.remC===0?'✅':m.remC}</span></td>
            <td style="${pageBg} border-left:1px solid var(--card-border); font-size:13.5px; padding:12px 8px; line-height:1.4;">
              ${m.actC>0 ? `<span>${cP}</span>` : `<span style="color:#cbd5e1;">—</span>`}
            </td>
          </tr>`;
        }).join('')}
        <tr class="total-row">
          <td colspan="2" style="font-size:14px; font-weight:700; padding:12px 8px;">รวมทั้งหมด</td>
          <td class="num" style="padding:12px 8px;"><span class="feather-need card" style="font-size:14px;">${sumNeedC}</span></td>
          <td class="num" style="padding:12px 8px;"><span class="feather-actual ${sumActC===totalC?'match':'partial'}" style="font-size:14px;">${sumActC}</span></td>
<td class="num" style="background:#fefce8;color:#854d0e;font-weight:700;font-size:14px; padding:12px 8px;">${sumRemC}</td>
          <td style="background:#f5f3ff;"></td>
        </tr>
        <tr>
          <td colspan="6" style="font-size:13px;color:var(--text2);text-align:center; padding:12px 8px; font-weight:600; background:var(--surface2);">
            ${sumActC>=sumNeedC && sumNeedC>0 ? '✅ การ์ดกองกลางแจกครบทุกคน' : (totalC>0 && sumActC<sumNeedC ? '⚠️ การ์ดไม่พอแจกถึงคิวท้าย' : '')}
            &nbsp;&nbsp;(แจกไปแล้ว ${sumActC}/${totalC} = ${pctC}%)
          </td>
        </tr>
      </tbody>
    </table>
  `;
}

// ── ฟังก์ชันก๊อปปี้ตารางเต็มรูปแบบ ──────────────────────
function copyFullTable() {
  if (!queData.length) return toast('ไม่มีข้อมูลให้คัดลอก', 'error');

  const limitC = parseInt(document.getElementById('limitCard').value) || 0;
  const totalC = parseInt(document.getElementById('totalCard').value) || 0;

  let simCCur = 0;
  let textOutput = "คิว\tชื่อสมาชิก\tการ์ด(สิทธิ์)\tการ์ด(ได้จริง)\tการ์ด(คงเหลือ)\n";

  queData.forEach(pq => {
    const orig = allRowsOriginal.find(x => x.name === pq.name) || {card:0};
    const nC = Math.min(orig.card, limitC);
    const aC = Math.min(nC, Math.max(0, totalC - simCCur));
    simCCur += aC;
    const remC = Math.max(0, orig.card - aC);
    textOutput += `${pq.num}\t${pq.name}\t${nC}\t${aC}\t${remC}\n`;
  });

  navigator.clipboard.writeText(textOutput).then(() => {
    alert('📋 คัดลอกตารางจำลองแจกการ์ดทั้งหมดเรียบร้อยแล้ว!\nสามารถเอาไปคลิกขวา Paste (วาง) ใน Google Sheet ได้เลยครับ');
  }).catch(err => {
    alert('เบราว์เซอร์บล็อกระบบอัตโนมัติ ให้ก็อปปี้ข้อความด้านล่างนี้ไปวางแทนครับ:\n\n' + textOutput);
  });
}

// ── ฟังก์ชันก๊อปปี้แบบมีชื่อติดไปด้วย สำหรับปุ่มในเมนูซ้าย ───────────────────
function copyDataBackToSheet() {
  if (!allRowsOriginal.length) return toast('ไม่พบข้อมูลที่จะคัดลอก', 'error');

  const limitC = parseInt(document.getElementById('limitCard').value) || 0;
  const totalC = parseInt(document.getElementById('totalCard').value) || 0;

  let simCCur = 0;
  let textOutput = "ชื่อสมาชิก\tการ์ดคงเหลือใหม่\n";

  queData.forEach(pq => {
    const orig = allRowsOriginal.find(x => x.name === pq.name);
    if(orig) {
      const aC = Math.min(Math.min(orig.card, limitC), Math.max(0, totalC - simCCur));
      simCCur += aC;
      textOutput += `${orig.name}\t${Math.max(0, orig.card - aC)}\n`;
    }
  });

  navigator.clipboard.writeText(textOutput).then(() => {
    alert('📋 คัดลอก "ชื่อ + ยอดการ์ดคงเหลือล่าสุด" เรียบร้อยแล้ว!\nนำไปวางทับใน Sheet เพื่อใช้เป็นคิวกิจกรรมรอบหน้าได้เลยครับ');
  });
}
// ── ฟังก์ชันสร้างข้อความหน้าประมูล (1 หน้า = 4 ชิ้น) ──────────
function pageLabel(s, e, p) {
  const sp = Math.floor(s/p)+1, s1 = (s%p)+1;
  const ep = Math.floor(e/p)+1, e1 = (e%p)+1;
  const numStyle = `padding: 2px 6px; border-radius: 4px; font-weight: 800; font-size: 16px; border: 1px solid #c4b5fd; background: #f5f3ff; color: #6d28d9;`;
  const itemStyle = `font-weight: 700; color: #7c3aed; font-size: 15px;`;
  if (sp === ep) {
    if (s1 === e1) return `หน้า <span style="${numStyle}">${sp}</span> อันที่ <span style="${itemStyle}">${s1}</span>`;
    return `เริ่มหน้า <span style="${numStyle}">${sp}</span> อันที่ <span style="${itemStyle}">${s1}</span> ถึง อันที่ <span style="${itemStyle}">${e1}</span>`;
  }
  return `เริ่มหน้า <span style="${numStyle}">${sp}</span> อันที่ <span style="${itemStyle}">${s1}</span> <span style="font-weight:bold;color:#64748b;">➔</span> ถึงหน้า <span style="${numStyle}">${ep}</span> อันที่ <span style="${itemStyle}">${e1}</span>`;
}

// ── เครื่องช่วยนับจำนวนการ์ดจากหน้าจอเกม ──────────────────
function applyCalculatedCards() {
  const csP = parseInt(document.getElementById('calcCStartP').value) || 1;
  const csI = parseInt(document.getElementById('calcCStartI').value) || 1;
  const ceP = parseInt(document.getElementById('calcCEndP').value);
  const ceI = parseInt(document.getElementById('calcCEndI').value);
  if (!ceP || !ceI) {
    alert('❌ กรุณากรอกหน้าและอันที่ของจุดจบให้ครบก่อนคำนวณครับ');
    return;
  }
  const idxStart = (csP - 1) * 4 + csI;
  const idxEnd   = (ceP - 1) * 4 + ceI;
  const totalCard = Math.max(0, idxEnd - idxStart + 1);
  const mainInput = document.getElementById('totalCard');
  if (mainInput) {
    mainInput.value = totalCard;
    recalc();
    toast(`⚡ คำนวณสำเร็จ! การ์ดที่ได้: ${totalCard} ใบ`, 'success');
  }
}
function recalc() {
  if (selectedQue) renderResult(selectedQue);
}

// ── Init from config ────────────────────────────────────────
(function initCardConfig() {
  const badge = document.getElementById('guildNameBadge');
  if (badge) badge.textContent = APP_CONFIG.guildName || 'Guild';
  document.title = '📕 Card Queue — ' + (APP_CONFIG.guildName || 'Guild');
  const sheetInput = document.getElementById('sheetId');
  if (sheetInput && !sheetInput.value) {
    sheetInput.value = APP_CONFIG.spreadsheetId || '';
  }
  const lc = document.getElementById('limitCard');
  const tc = document.getElementById('totalCard');
  if (lc) lc.value = APP_CONFIG.defaultLimitCard  || 10;
  if (tc) tc.value = APP_CONFIG.defaultTotalCard  || 140;
  if (!APP_CONFIG.spreadsheetId || !APP_CONFIG.auctionListCardGid) {
    console.warn('⚠️ กรุณาตั้งค่า spreadsheetId และ auctionListCardGid ใน config.js');
  }
})();
</script>
